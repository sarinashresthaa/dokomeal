name: Deploy Dokomeal Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy static files
        run: |
          rsync -av --delete build/ /home/deploy/dokomandu/www/dokomeal/
