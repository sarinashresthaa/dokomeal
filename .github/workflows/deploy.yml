name: Deploy Dokomeal

on:
  push:
    branches: [main]     # change if your default branch is different

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Restart app
        run: pm2 restart dokomeal || pm2 start npm --name "dokomeal" -- start
